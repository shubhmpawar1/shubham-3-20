<div class="relative isolate bg-white pt-24 pb-32 sm:pt-32">
  <!-- Background blur shapes -->
  <div class="absolute inset-x-0 top-1/2 -z-10 -translate-y-1/2 transform-gpu overflow-hidden opacity-30 blur-3xl"
    aria-hidden="true">
    <div class="ml-[max(50%,38rem)] aspect-1313/771 w-[82.0625rem] bg-gradient-to-tr from-[#ff80b5] to-[#9089fc]"
      style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)">
    </div>
  </div>

  <div
    class="absolute inset-x-0 top-0 -z-10 flex transform-gpu overflow-hidden pt-32 opacity-25 blur-3xl sm:pt-40 xl:justify-end"
    aria-hidden="true">
    <div
      class="ml-[-22rem] aspect-1313/771 w-[82.0625rem] flex-none origin-top-right rotate-[30deg] bg-gradient-to-tr from-[#ff80b5] to-[#9089fc] xl:mr-[calc(50%-12rem)] xl:ml-0"
      style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)">
    </div>
  </div>

  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-base/7 font-semibold text-{{color}}-600">{{ learners_section.sub_title }}</h2>
      <p class="mt-2 text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">
        {{ learners_section.title }}
      </p>
      <p class="mt-6 text-lg leading-8 text-gray-600">
        {{ learners_section.description }}
      </p>
    </div>

    <div *ngIf="learners_section?.details?.length"
      class="mx-auto mt-16 grid max-w-2xl grid-cols-1 grid-rows-1 gap-8 text-sm/6 text-gray-900 sm:mt-20 sm:grid-cols-2 xl:mx-0 xl:max-w-none xl:grid-flow-col xl:grid-cols-4">

      <!-- First big testimonial (center) -->
      <figure class="rounded-2xl bg-white shadow-lg ring-1 ring-gray-900/5 sm:col-span-2 xl:col-start-2 xl:row-end-1"
        *ngIf="learners_section.details[0] as item">
        <blockquote class="p-6 text-lg font-semibold tracking-tight text-gray-900 sm:p-12 sm:text-xl/8">
          <p>{{ item.description }}</p>
        </blockquote>
        <figcaption
          class="flex flex-wrap items-center gap-x-4 gap-y-4 border-t border-gray-900/10 px-6 py-4 sm:flex-nowrap">
          <img class="size-10 flex-none rounded-full bg-gray-50" [src]="item.image" alt="">
          <div class="flex-auto">
            <div class="font-semibold">{{ item.name }}</div>
            <div class="text-gray-600">{{ item.tagline }}</div>
          </div>

          <img class="h-10 w-auto flex-none" [src]="item.logo" alt="">
        </figcaption>
      </figure>

      <!-- First column -->
      <div class="space-y-8 xl:contents xl:space-y-0">
        <div class="space-y-8 xl:row-span-2">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5"
            *ngIf="learners_section.details[1] as item">
            <blockquote class="text-gray-900">
              <p>{{ item.description }}</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img class="size-10 rounded-full bg-gray-50" [src]="item.image" alt="">
              <div>
                <div class="font-semibold">{{ item.name }}</div>
                <div class="text-gray-600">{{ item.tagline }}</div>
              </div>
            </figcaption>
          </figure>
          <!-- More testimonials in this column if needed -->
        </div>
        <div class="space-y-8 xl:row-start-1">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5"
            *ngIf="learners_section.details[2] as item">
            <blockquote class="text-gray-900">
              <p>{{ item.description }}</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img class="size-10 rounded-full bg-gray-50" [src]="item.image" alt="">
              <div>
                <div class="font-semibold">{{ item.name }}</div>
                <div class="text-gray-600">{{ item.tagline }}</div>
              </div>
            </figcaption>
          </figure>
        </div>
      </div>

      <!-- Second column -->
      <div class="space-y-8 xl:contents xl:space-y-0">
        <div class="space-y-8 xl:row-start-1">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5"
            *ngIf="learners_section.details[3] as item">
            <blockquote class="text-gray-900">
              <p>{{ item.description }}</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img class="size-10 rounded-full bg-gray-50" [src]="item.image" alt="">
              <div>
                <div class="font-semibold">{{ item.name }}</div>
                <div class="text-gray-600">{{ item.tagline }}</div>
              </div>
            </figcaption>
          </figure>
        </div>
        <div class="space-y-8 xl:row-span-2">
          <figure class="rounded-2xl bg-white p-6 shadow-lg ring-1 ring-gray-900/5"
            *ngIf="learners_section.details[4] as item">
            <blockquote class="text-gray-900">
              <p>{{ item.description }}</p>
            </blockquote>
            <figcaption class="mt-6 flex items-center gap-x-4">
              <img class="size-10 rounded-full bg-gray-50" [src]="item.image" alt="">
              <div>
                <div class="font-semibold">{{ item.name }}</div>
                <div class="text-gray-600">{{ item.tagline }}</div>
              </div>
            </figcaption>
          </figure>
        </div>
      </div>
    </div>
  </div>
</div>
