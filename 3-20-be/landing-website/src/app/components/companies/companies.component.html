<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div
      class="mx-auto grid max-w-lg grid-cols-4 items-center gap-x-8 gap-y-12 sm:max-w-xl sm:grid-cols-6 sm:gap-x-10 sm:gap-y-14 lg:mx-0 lg:max-w-none lg:grid-cols-5">
      <img *ngFor="let item of companies"
        class="col-span-2 max-h-12 w-full object-contain lg:col-span-1" [src]="item.src" [alt]="item.alt" width="158"
        height="48">
    </div>
    <div class="mt-16 flex justify-center">
      <p class="relative rounded-full bg-gray-50 px-4 py-1.5 text-sm/6 text-gray-600 ring-1 ring-gray-900/5 ring-inset">
        <span class="hidden md:inline">Great teams are built with great people. That’s why they keep coming back.</span>
        <a href="#" class="font-semibold text-{{color}}-600"><span class="absolute inset-0" aria-hidden="true"></span> Read
          our customer stories <span aria-hidden="true">&rarr;</span></a>
      </p>
    </div>
  </div>
</div>
