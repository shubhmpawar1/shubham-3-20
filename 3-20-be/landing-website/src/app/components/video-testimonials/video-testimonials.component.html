<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">{{testimonials_2.title}}</h2>
      <p class="mt-2 text-lg/8 text-gray-600">{{testimonials_2.description}}</p>
    </div>
    <div class="mx-auto mt-16 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-20 lg:mx-0 lg:max-w-none lg:grid-cols-3">
      <article *ngFor="let item of testimonials_2.details"
        class="flex flex-col items-start justify-between">
        <div class="relative w-full">
          <a [href]="item.video_url" target="_blank">
            <img [src]="item.video_thumbnail" alt="Video Thumbnail of {{ item.name }}"
              class="aspect-video w-full rounded-2xl bg-gray-100 object-cover">
            <!-- Overlay ring -->
            <div class="absolute inset-0 rounded-2xl ring-1 ring-gray-900/10 ring-inset"></div>

            <!-- Play button overlay with darker background and larger icon -->
            <div class="absolute inset-0 flex items-center justify-center bg-black/30 rounded-2xl">
              <div
                class="flex items-center justify-center h-20 w-20 rounded-full bg-black/70 shadow-xl ring-1 ring-black/30 hover:bg-black/60 transition">
                <svg class="h-12 w-12 text-white" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                  <path fill-rule="evenodd" d="M6.5 5.5v9l7-4.5-7-4.5z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>
          </a>
        </div>
        <div class="mt-4">
          <h3 class="text-lg font-semibold text-gray-900">{{ item.name }}</h3>
          <p class="text-sm text-gray-600">{{ item.location }}</p>
          <p class="mt-1 text-base text-gray-700">{{ item.description }}</p>
        </div>
      </article>
      <!-- More posts... -->
    </div>
  </div>
</div>
