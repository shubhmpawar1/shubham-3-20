<div class="bg-gray-900 py-24 sm:py-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="mx-auto max-w-4xl text-center">
            <h2 class="text-base/7 font-semibold text-{{color}}-400">Pricing</h2>
            <p class="mt-2 text-5xl font-semibold tracking-tight text-balance text-white sm:text-6xl">Simple,
                transparent pricing</p>
        </div>
        <div class="mt-8 max-w-2xl mx-auto">
            <div class="relative w-full bg-white/5 rounded-full flex items-center gap-4 p-2" #button_group>
                <span
                    class="absolute bg-white/15 h-[85%] z-[1] pointer-events-none rounded-full transition-all duration-300 ease-in-out"
                    [ngStyle]="{ left: indicator_left + 'px', width: indicator_width + 'px'}"></span>
                <button *ngFor="let label of buttons; let i = index"
                    class="bg-transparent z-[2] relative p-2 w-max text-white cursor-pointer"
                    (click)="move_indicator($event)">
                    {{ label }}
                </button>
            </div>
        </div>

        <div class="space-y-8 p-4">
            <div>
                <h2 class="text-xl font-semibold mb-4 text-white">Technical Skills:</h2>
                <div class="flex flex-wrap gap-4 justify-center" *ngIf="(courses | getCoursePlan : selected_course : true) as course">
                    <ng-container 
                        *ngFor="let tag of course.content?.technical; let i = index">
                        <span
                        [ngClass]="{'border border-green-500': tag.is_selected}"
                            class="text-xs px-5 py-2 bg-gray-200 rounded-full font-medium shadow flex items-center gap-2" (click)="skill_clicked(i ,tag, course, 'technical', selected_course)">
                            <div class=" border h-5 w-5 rounded-full overflow-hidden bg-green-500 flex justify-center items-center text-white">
                                <img *ngIf="!tag.is_selected" [src]="tag.image" [alt]="tag.title"
                                    class="h-full w-full object-cover">
                                <svg *ngIf="tag.is_selected" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                                </svg>
                            </div>
                            {{ tag.title }}
                        </span>
                    </ng-container>
                </div>
            </div>
            <div>
                <h2 class="text-xl font-semibold mb-4 text-white">Non Technical Skills:</h2>

                <div class="flex flex-wrap gap-4 justify-center" *ngIf="(courses | getCoursePlan : selected_course : true) as course">
                    <ng-container 
                        *ngFor="let tag of course.content?.non_technical; let i = index">
                        <span
                        [ngClass]="{'border border-green-500': tag.is_selected}"
                            class="text-xs px-5 py-2 bg-gray-200 rounded-full font-medium shadow flex items-center gap-2" (click)="skill_clicked(i ,tag, course, 'non_technical', selected_course)">
                            <div class=" border h-5 w-5 rounded-full overflow-hidden bg-green-500 flex justify-center items-center text-white">
                                <img *ngIf="!tag.is_selected" [src]="tag.image" [alt]="tag.title"
                                    class="h-full w-full object-cover">
                                <svg *ngIf="tag.is_selected" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="size-4">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                                </svg>
                            </div>
                            {{ tag.title }}
                        </span>
                    </ng-container>
                </div>
            </div>
        </div>


        <section class="text-gray-700 body-font overflow-hidden">
            <div class="container px-5 py-10 mx-auto flex flex-wrap">
                <div class="lg:w-1/4 mt-[198px] hidden lg:block">
                    <div
                        class="mt-px border-t shadow-2xl border-b border-l rounded-tl-lg rounded-bl-lg overflow-hidden">
                        <p *ngFor="let crt of ctriteria; let i = index"
                            [ngClass]="{'': (i+1 )% 2 == 0, 'bg-white/5' : (i+1) % 2 != 0}"
                            class="h-12 text-center px-4 flex items-center justify-start -mt-px text-white">
                            {{crt}}</p>
                    </div>
                </div>
                <div class="flex lg:w-3/4 w-full flex-wrap rounded-3xl lg:border">
                    <div *ngFor="let item of (courses | getCoursePlan : selected_course: false); let i = index"
                        [ngClass]="{'border-x': i ==1}" class="lg:w-1/3 lg:mt-px w-full mb-10 lg:mb-0 rounded-md">
                        <div class="px-2 text-center h-48 flex flex-col items-center justify-center">
                            <h3 class="text-lg/8 font-semibold text-white">{{item.type}}</h3>
                            <h2 class="text-5xl text-white font-medium leading-none mb-4 mt-2">₹ {{item.price}}</h2>
                            <span class="text-sm text-white">Next {{item.duration}}</span>
                        </div>

                        <ng-container *ngFor="let elm of ctriteria; let i = index">
                            <p [ngClass]="{'text-gray-600': (i+1 )% 2 == 0, 'bg-white/5  text-gray-600' : (i+1) % 2 != 0}"
                                class="text-gray-600 text-center h-12 flex items-center justify-center">
                                @if(item.features[elm]) {
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="size-6 text-green-500">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                }

                                @if(!item.features[elm]){
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor" class="size-6 text-red-500">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                }
                            </p>
                        </ng-container>
                        <div class="border-t p-6 text-center rounded-bl-lg">
                            <button
                                class="w-full block rounded-md bg-{{color}}-500 px-3 py-2 text-center text-sm/6 font-semibold text-white shadow-xs hover:bg-{{color}}-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-{{color}}-500">Buy
                                plan</button>
                            <p class="text-xs text-white mt-5">Literally you probably haven't heard of them jean
                                shorts.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
