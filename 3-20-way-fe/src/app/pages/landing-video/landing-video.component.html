<div class="relative h-screen w-full overflow-hidden bg-black flex flex-col items-center justify-end pb-6">
    <!-- Video Background -->
    <video #bgVideo autoplay muted loop playsinline class="absolute inset-0 h-full w-full object-cover opacity-70">
        <source src="assets/video/loop.mp4" type="video/mp4">
    </video>

    <!-- Vignette Overlay -->
    <div class="absolute inset-0 pointer-events-none bg-radial-[circle_at_center,transparent_0%,rgba(0,0,0,0.4)_100%]"></div>

    <!-- Buttons Row -->
    <div class="relative z-10 flex items-center gap-4">

        <!-- Mute / Unmute Button -->
        <button (click)="toggleMute()"
            class="flex items-center justify-center w-12 h-12 bg-black/50 hover:bg-black/70 text-white rounded-full border border-white/30 backdrop-blur-sm transition-all"
            [attr.aria-label]="isMuted ? 'Unmute' : 'Mute'">

            <!-- Muted icon (speaker with X) -->
            <svg *ngIf="isMuted" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>

            <!-- Unmuted icon (speaker with waves) -->
            <svg *ngIf="!isMuted" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            </svg>
        </button>

        <!-- Skip Button -->
        <button (click)="skipVideo()"
            class="px-8 py-3 bg-[#f58220] hover:bg-[#e67610] text-white text-xl font-bold rounded-full border-2 border-white/20 shadow-2xl transform transition-all active:scale-95">
            Click to skip video
        </button>
    </div>
</div>
