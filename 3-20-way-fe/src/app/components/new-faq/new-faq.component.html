<div class="bg-white" *ngIf="faq_data">
    <div class="mx-auto max-w-7xl px-6 py-24 sm:py-32 lg:px-8 lg:py-40">
        <div class="mx-auto max-w-4xl">
            <h2 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">{{ faq_data.title }}</h2>
            <dl class="mt-16 divide-y divide-gray-900/10">
                <div *ngFor="let item of faq_data.items" class="py-6 first:pt-0 last:pb-0">
                    <dt>
                        <button type="button" (click)="toggleItem(item)"
                            class="flex w-full items-start justify-between text-left text-gray-900">
                            <span class="text-base/7 font-semibold">{{ item.question }}</span>
                            <span class="ml-6 flex h-7 items-center">
                                <!-- Plus Icon (Shown when closed) -->
                                <svg [class.hidden]="item.open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    data-slot="icon" aria-hidden="true" class="size-6">
                                    <path d="M12 6v12m6-6H6" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <!-- Minus Icon (Shown when open) -->
                                <svg [class.hidden]="!item.open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                                    data-slot="icon" aria-hidden="true" class="size-6">
                                    <path d="M18 12H6" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                        </button>
                    </dt>
                    <div [class.hidden]="!item.open" class="contents">
                        <dd class="mt-2 pr-12">
                            <p class="text-base/7 text-gray-600">{{ item.answer }}</p>
                        </dd>
                    </div>
                </div>
            </dl>
        </div>
    </div>
</div>
