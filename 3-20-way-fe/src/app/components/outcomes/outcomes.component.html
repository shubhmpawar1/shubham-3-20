<div class="bg-white py-24 sm:py-32" *ngIf="outcomes_data">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <h2 class="text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">{{
                outcomes_data.title }}</h2>
            <p class="mt-2 text-lg/8 text-gray-600">{{ outcomes_data.description }}</p>
        </div>
        <div class="mx-auto mt-16 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-20 lg:mx-0 lg:max-w-none lg:grid-cols-3">
            <article *ngFor="let article of outcomes_data.articles" class="flex flex-col items-start justify-between">
                <div class="relative w-full">
                    <img [src]="article.image" alt="" class="w-full rounded-2xl bg-gray-100" />
                    <div class="absolute inset-0 rounded-2xl inset-ring inset-ring-gray-900/10"></div>
                </div>
                <div class="flex max-w-xl grow flex-col justify-between">
                    <!-- <div class="mt-8 flex items-center gap-x-4 text-xs">
                        <time [attr.datetime]="article.datetime" class="text-gray-500">{{ article.date }}</time>
                        <a href="#"
                            class="relative z-10 rounded-full bg-gray-50 px-3 py-1.5 font-medium text-gray-600 hover:bg-gray-100">{{
                            article.category }}</a>
                    </div> -->
                    <div class="group relative grow">
                        <h3 class="mt-3 text-lg/6 font-semibold text-gray-900 group-hover:text-gray-600">
                            <a href="#">
                                <span class="absolute inset-0"></span>
                                {{ article.title }}
                            </a>
                        </h3>
                        <p class="mt-5 line-clamp-3 text-sm/6 text-gray-600">{{ article.description }}</p>
                    </div>
                    <!-- <div class="relative mt-8 flex items-center gap-x-4 justify-self-end">
                        <img [src]="article.author.image" alt="" class="size-10 rounded-full bg-gray-100" />
                        <div class="text-sm/6">
                            <p class="font-semibold text-gray-900">
                                <a href="#">
                                    <span class="absolute inset-0"></span>
                                    {{ article.author.name }}
                                </a>
                            </p>
                            <p class="text-gray-600">{{ article.author.role }}</p>
                        </div>
                    </div> -->
                </div>
            </article>
        </div>
    </div>
</div>
