<section class="relative bg-white mt-8 py-4 overflow-hidden">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row items-center gap-16 lg:gap-24">

      <!-- ===== LEFT: Portrait Video ===== -->
      <div class="flex-shrink-0 w-72 sm:w-80 lg:w-[26rem]">
        <!-- Video card -->
        <div class="relative overflow-hidden rounded-3xl shadow-2xl aspect-[9/16] bg-gray-900">
          <!-- YouTube embed — fills & covers the container -->
          <iframe *ngIf="safeVideoUrl" [src]="safeVideoUrl" class="absolute inset-0 w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="Karen Case - The 3-20 Way Founder">
          </iframe>
        </div>
      </div>

      <!-- ===== RIGHT: Text + CTA ===== -->
      <div class="flex-1 text-center lg:text-left">
        <!-- Headline -->
        <h2 class="mt-5 text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl lg:text-balance leading-tight">
          {{ woman_behind.headline }}
        </h2>
        <!-- CTA -->
        <div class="mt-10 flex justify-center lg:justify-start">
          <a [href]="woman_behind.cta.link" target="_blank" rel="noopener noreferrer" class="group inline-flex items-center gap-3 rounded-full bg-orange-600 px-8 py-4 text-sm font-semibold text-white shadow-lg shadow-orange-200 hover:bg-orange-500 hover:shadow-orange-300 transition-all duration-300">
            {{ woman_behind.cta.text }}
            <span class="flex h-7 w-7 items-center justify-center rounded-full bg-white/20 group-hover:bg-white/30 transition-colors duration-200">
              <svg class="size-3.5 transition-transform duration-200 group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
              </svg>
            </span>
          </a>
        </div>

      </div>

    </div>
  </div>
</section>
