<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <!-- Heading -->
    <div class="mx-auto max-w-2xl lg:mx-0 mb-16">
      <h2 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">
        {{ member_testimonials.title }}
      </h2>
    </div>

    <!-- Timeline grid -->
    <div class="mx-auto grid max-w-2xl grid-cols-1 gap-8 overflow-hidden lg:mx-0 lg:max-w-none lg:grid-cols-4">
      <div *ngFor="let item of member_testimonials.details; let i = index" class="relative">

        <!-- Timeline label row -->
        <div class="flex items-center text-sm/6 font-semibold text-{{color}}-600">
          <svg viewBox="0 0 4 4" aria-hidden="true" class="mr-4 size-1 flex-none">
            <circle r="2" cx="2" cy="2" fill="currentColor" />
          </svg>
          Member {{ i + 1 }}
          <div aria-hidden="true" class="absolute -ml-2 h-px w-screen -translate-x-full bg-gray-900/10 sm:-ml-4 lg:static lg:-mr-6 lg:ml-8 lg:w-auto lg:flex-auto lg:translate-x-0"></div>
        </div>

        <!-- Quote icon -->
        <svg class="mt-6 size-8 text-{{color}}-600" fill="currentColor" viewBox="0 0 32 32">
          <path d="M9.352 4C4.456 7.456 1 13.12 1 19.36c0 5.088 3.072 8.064 6.624 8.064 3.36 0 5.856-2.688 5.856-5.856 0-3.168-2.208-5.472-5.088-5.472-.576 0-1.344.096-1.536.192.48-3.264 3.552-7.104 6.624-9.024L9.352 4zm16.512 0c-4.8 3.456-8.256 9.12-8.256 15.36 0 5.088 3.072 8.064 6.624 8.064 3.264 0 5.856-2.688 5.856-5.856 0-3.168-2.304-5.472-5.184-5.472-.576 0-1.248.096-1.44.192.48-3.264 3.456-7.104 6.528-9.024L25.864 4z" />
        </svg>

        <p class="mt-3 text-base/7 text-gray-600">{{ item.description }}</p>

      </div>
    </div>

  </div>
</div>
