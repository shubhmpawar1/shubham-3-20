<div class="bg-white">
  <div class="mx-auto max-w-7xl px-6 py-24 sm:py-32 lg:px-8 lg:py-40">
    <div class="mx-auto max-w-4xl">

      <h2 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">{{ faq_section.title }}</h2>

      <dl class="mt-16 divide-y divide-gray-900/10">
        <div *ngFor="let item of faq_section.details; let i = index" class="py-6 first:pt-0 last:pb-0">

          <dt>
            <button type="button" (click)="toggle(i)"
              class="flex w-full items-start justify-between text-left text-gray-900">
              <span class="text-base/7 font-semibold">{{ item.question }}</span>
              <span class="ml-6 flex h-7 items-center">
                <!-- Plus icon (collapsed) -->
                <svg *ngIf="!item.expanded" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
                  <path d="M12 6v12m6-6H6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <!-- Minus icon (expanded) -->
                <svg *ngIf="item.expanded" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" class="size-6">
                  <path d="M18 12H6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </span>
            </button>
          </dt>

          <dd *ngIf="item.expanded" class="mt-2 pr-12">
            <p class="text-base/7 text-gray-600">{{ item.answer }}</p>
            <ul *ngIf="item.list" class="mt-3 space-y-2">
              <li *ngFor="let point of item.list" class="flex items-start gap-3 text-base/7 text-gray-600">
                <span class="mt-2.5 h-1.5 w-1.5 flex-shrink-0 rounded-full bg-{{color}}-600"></span>
                {{ point }}
              </li>
            </ul>
          </dd>

        </div>
      </dl>

      <!-- CTA -->
      <div class="mt-14">
        <a [href]="faq_section.cta.link"
          class="inline-flex items-center gap-3 rounded-full bg-{{color}}-600 px-8 py-4 text-sm font-semibold text-white shadow-lg hover:bg-{{color}}-500 transition-colors duration-200">
          {{ faq_section.cta.text }}
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
          </svg>
        </a>
      </div>

    </div>
  </div>
</div>
