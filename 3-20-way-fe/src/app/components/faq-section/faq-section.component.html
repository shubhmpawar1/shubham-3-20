<div class="bg-white mt-8 py-6">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <div class="mx-auto max-w-4xl">

      <!-- Heading -->
      <div class="flex items-center gap-4 mb-12">
        <div class="h-1 w-12 rounded-full bg-orange-600"></div>
        <h2 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">
          {{ faq_section.title }}
        </h2>
      </div>

      <!-- Accordion -->
      <dl class="divide-y divide-gray-200">
        <div *ngFor="let item of faq_section.details; let i = index" class="py-6">

          <!-- Question row -->
          <dt>
            <button type="button"
              class="flex w-full cursor-pointer items-center justify-between gap-6 text-left"
              (click)="toggle(i)">
              <span class="text-base/7 font-semibold text-gray-900">{{ item.question }}</span>
              <span class="flex h-7 w-7 flex-shrink-0 items-center justify-center text-gray-400 transition-transform duration-200"
                [style.transform]="item.expanded ? 'rotate(45deg)' : 'rotate(0deg)'">
                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6"/>
                </svg>
              </span>
            </button>
          </dt>

          <!-- Answer -->
          <dd *ngIf="item.expanded" class="mt-4 pr-12">
            <p class="text-base/7 text-gray-600">{{ item.answer }}</p>
            <ul *ngIf="item.list" class="mt-3 space-y-2">
              <li *ngFor="let point of item.list" class="flex items-start gap-3 text-base/7 text-gray-600">
                <span class="mt-2.5 h-1.5 w-1.5 flex-shrink-0 rounded-full bg-orange-600"></span>
                {{ point }}
              </li>
            </ul>
          </dd>

        </div>
      </dl>

      <!-- CTA -->
      <div class="mt-14">
        <a [href]="faq_section.cta.link"
          class="inline-flex items-center gap-3 rounded-full bg-orange-600 px-8 py-4 text-sm font-semibold text-white shadow-lg shadow-orange-200 hover:bg-orange-500 transition-colors duration-200">
          {{ faq_section.cta.text }}
          <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
          </svg>
        </a>
      </div>

    </div>
  </div>
</div>
