<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">

    <!-- Header -->
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">{{ technical_benefits.title }}</h2>
      <p class="mt-4 text-lg/8 text-gray-600">{{ technical_benefits.description }}</p>
    </div>

    <!-- Creative Staircase Diagram -->
    <div class="mt-8 flex flex-col gap-6 lg:flex-row lg:items-end lg:gap-4">

      <ng-container *ngFor="let item of technical_benefits.details; let i = index; let last = last">

        <!-- Card — each one taller than the previous via padding-top -->
        <div class="relative flex-1 overflow-hidden rounded-3xl bg-gradient-to-b from-{{color}}-50 to-white shadow-md ring-1 ring-{{color}}-100" [style.paddingTop.px]="48 + i * 40">

          <!-- Large decorative step number in background -->
          <span class="absolute top-3 right-4 text-8xl font-black text-{{color}}-100 select-none leading-none">
            {{ i + 1 }}
          </span>

          <!-- Content -->
          <div class="relative px-6 pb-8">
            <!-- Timeframe badge -->
            <span class="inline-block rounded-full bg-{{color}}-600 px-3 py-1 text-xs font-semibold text-white shadow-sm">
              {{ item.title }}
            </span>
            <!-- Description -->
            <p class="mt-4 text-base/7 text-gray-600">{{ item.description }}</p>
          </div>

          <!-- Coloured bottom bar -->
          <div class="h-2 w-full bg-{{color}}-600 opacity-{{ 40 + i * 30 }}"></div>
        </div>

        <!-- Arrow between cards (desktop only) -->
        <div *ngIf="!last" class="hidden lg:flex items-center justify-center self-center">
          <svg class="h-6 w-6 text-{{color}}-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
          </svg>
        </div>

      </ng-container>

    </div>

  </div>
</div>
