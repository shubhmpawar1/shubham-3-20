<ng-container [ngSwitch]="type">

    <!-- Textarea -->
    <textarea *ngSwitchCase="'textarea'" class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-{{color}}-600" [attr.placeholder]="label"
        [value]="value" (input)="handleInput($event)" (blur)="onTouched()"></textarea>

    <!-- Select with optgroups -->
    <select *ngSwitchCase="'select'" class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-500 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-{{color}}-600" [value]="value"
        (change)="handleInput($event)" (blur)="onTouched()">
        <option value="" class="bg-white px-3.5 py-2 text-base text-gray-900">{{label}}</option>
        <ng-container *ngFor="let group of options">
            <optgroup [label]="group.label">
                <option *ngFor="let item of group.value" [value]="item">{{ item }}</option>
            </optgroup>
        </ng-container>
    </select>

    <!-- Default: For text, tel, email, number etc -->
    <input *ngSwitchDefault class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-{{color}}-600" [attr.placeholder]="label" [value]="value"
        (input)="handleInput($event)" (blur)="onTouched()" [type]="type" />

</ng-container>
