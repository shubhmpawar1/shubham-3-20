<div class="bg-white" *ngIf="daily_wins">
    <div class="px-6 py-24 sm:py-32 lg:px-8">
        <div class="mx-auto max-w-2xl text-center">
            <h2 class="text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl">
                {{ daily_wins.headline }}
            </h2>
            <p class="mx-auto mt-6 max-w-xl text-lg/8 text-pretty text-gray-600">{{ daily_wins.subtitle }}</p>
            <div class="mt-10 flex items-center justify-center gap-x-6">
                <a href="#"
                    class="rounded-md bg-orange-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-orange-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">{{
                    daily_wins.cta.text }}</a>
                <a href="#" class="text-sm/6 font-semibold text-gray-900">Learn more <span
                        aria-hidden="true">→</span></a>
            </div>
        </div>
    </div>
</div>
