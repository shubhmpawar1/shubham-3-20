<div class="bg-white py-24 sm:py-32">
  <div class="mx-auto max-w-7xl px-6 lg:px-8">
    <!-- ===== SECTION 2: FEES ===== -->
    <div class="mx-auto mt-24 max-w-4xl text-center">
      <h2 class="text-xl/7 font-semibold text-orange-600">{{ getting_started.fees_headline }}</h2>
      <p class="mt-2 text-2xl font-bold tracking-tight text-balance text-gray-900 ">
        {{ getting_started.fees_stack_intro }}
      </p>
    </div>
    <p class="mx-auto mt-6 max-w-2xl text-center text-lg font-medium text-pretty text-gray-600 sm:text-xl/8">
      {{ getting_started.fees_body }}
    </p>

    <!-- Pricing Cards -->
    <div class="isolate mx-auto mt-16 grid max-w-md grid-cols-1 gap-y-8 sm:mt-20 lg:mx-0 lg:max-w-none lg:grid-cols-3 lg:gap-x-8">
      <div *ngFor="let tier of getting_started.fees_tiers" class="flex flex-col justify-between rounded-3xl bg-white p-8 inset-ring inset-ring-gray-200 xl:p-10">
        <div>
          <h3 class="text-lg/8 font-semibold text-orange-600">{{ tier.name }}</h3>

          <!-- Steps — 1st card -->
          <ol *ngIf="tier.steps" class="mt-6 space-y-3 list-decimal list-inside text-sm/6 text-gray-600">
            <li *ngFor="let step of tier.steps">{{ step }}</li>
          </ol>

          <!-- Price — 2nd & 3rd card -->
          <ng-container *ngIf="tier.price">
            <p class="mt-6 flex items-baseline gap-x-1">
              <span class="text-4xl font-semibold tracking-tight text-gray-900">{{ tier.price }}</span>
              <span class="text-sm/6 font-semibold text-gray-600">{{ tier.period }}</span>
            </p>
            <p class="mt-3 text-sm/6 text-gray-500">{{ tier.note }}</p>
          </ng-container>
        </div>
        <a href="{{ tier.cta.link }}" class="mt-8 block rounded-md bg-orange-600 px-3 py-2 text-center text-sm/6 font-semibold text-white shadow-xs hover:bg-orange-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600">
          {{ tier.cta.text }}
        </a>
      </div>
    </div>

    <p class="mx-auto mt-10 max-w-2xl text-center text-sm text-gray-500">
      {{ getting_started.no_risk }}
    </p>
    <div class="mt-8 flex justify-center">
      <a href="{{ getting_started.cta_2.link }}" class="block rounded-md bg-orange-600 px-6 py-3 text-center text-sm/6 font-semibold text-white shadow-xs hover:bg-orange-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600">
        {{ getting_started.cta_2.text }}
      </a>
    </div>

  </div>
</div>
