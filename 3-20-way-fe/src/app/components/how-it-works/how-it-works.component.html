<div class="bg-white py-24 sm:py-32" *ngIf="how_it_works_data">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="mx-auto max-w-2xl lg:mx-0 lg:max-w-none">
            <p class="text-base/7 font-semibold text-orange-600">{{ how_it_works_data.tagline }}</p>
            <h1 class="mt-2 text-4xl font-semibold tracking-tight text-pretty text-gray-900 sm:text-5xl">
                {{ how_it_works_data.title }}
            </h1>
            <div class="mt-10 grid max-w-xl grid-cols-1 gap-8 text-base/7 text-gray-700 lg:max-w-none lg:grid-cols-2">
                <div>
                    <p *ngFor="let p of how_it_works_data.description_col1; let first = first"
                        [ngClass]="{'mt-8': !first}">
                        {{ p }}
                    </p>
                </div>
                <div>
                    <p *ngFor="let p of how_it_works_data.description_col2; let first = first"
                        [ngClass]="{'mt-8': !first}">
                        {{ p }}
                    </p>
                </div>
            </div>
            <div class="mt-10 flex">
                <a [href]="how_it_works_data.cta.href"
                    class="rounded-md bg-orange-500 px-3.5 py-2.5 text-sm font-semibold text-white shadow-xs hover:bg-orange-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    {{ how_it_works_data.cta.text }}
                </a>
            </div>
        </div>
    </div>
    <div class="relative overflow-hidden pt-16 lg:pt-20">
        <div class="mx-auto max-w-7xl px-6 lg:px-8">
            <img *ngIf="how_it_works_data.image" [src]="how_it_works_data.image" alt=""
                class="mb-[-12%] rounded-xl shadow-2xl ring-1 ring-gray-900/10" />
            <video *ngIf="how_it_works_data.video" [src]="how_it_works_data.video" controls
                class="mb-[-12%] rounded-xl shadow-2xl ring-1 ring-gray-900/10 w-full aspect-video">
            </video>
            <div aria-hidden="true" class="relative">
                <div class="absolute -inset-x-20 bottom-0 bg-linear-to-t from-white pt-[7%]"></div>
            </div>
        </div>
    </div>
</div>
