<div class="bg-white">
    <main>
        <div class="relative isolate">
            <svg class="absolute inset-x-0 top-0 -z-10 h-[64rem] w-full [mask-image:radial-gradient(32rem_32rem_at_center,white,transparent)] stroke-gray-200" aria-hidden="true">
                <defs>
                    <pattern id="1f932ae7-37de-4c0a-a8b0-a6e3b4d44b84" width="200" height="200" x="50%" y="-1" patternUnits="userSpaceOnUse">
                        <path d="M.5 200V.5H200" fill="none" />
                    </pattern>
                </defs>
                <svg x="50%" y="-1" class="overflow-visible fill-gray-50">
                    <path d="M-200 0h201v201h-201Z M600 0h201v201h-201Z M-400 600h201v201h-201Z M200 800h201v201h-201Z" stroke-width="0" />
                </svg>
                <rect width="100%" height="100%" stroke-width="0" fill="url(#1f932ae7-37de-4c0a-a8b0-a6e3b4d44b84)" />
            </svg>
            <div class="overflow-hidden">
                <div class="mx-auto max-w-7xl px-6 pt-20 pb-32 sm:pt-60 lg:px-8 lg:pt-16">
                    <div class="mx-auto max-w-2xl gap-x-14 lg:mx-0 lg:flex lg:max-w-none lg:items-center">
                        <div class="mx-auto max-w-2xl lg:mx-0 lg:shrink-0 lg:pt-8">
                            <!-- <img class="h-11" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color={{color}}&shade=600" alt="Your Company"> -->
                            <div>
                                <a href="#" class="inline-flex flex-wrap space-y-3 space-x-3">
                                    <span class="rounded-full bg-{{color}}-600/10 px-3 py-1 text-sm/6 font-semibold text-{{color}}-600 ring-1 ring-{{color}}-600/10 ring-inset">{{hero_section.pill_1}}</span>
                                    <span class="rounded-full bg-{{color}}-600/10 px-3 py-1 text-sm/6 font-semibold text-{{color}}-600 ring-1 ring-{{color}}-600/10 ring-inset">{{hero_section.pill_2}}</span>
                                    <span class="rounded-full bg-{{color}}-600/10 px-3 py-1 text-sm/6 font-semibold text-{{color}}-600 ring-1 ring-{{color}}-600/10 ring-inset">{{hero_section.pill_3}}</span>
                                    <span class="rounded-full bg-{{color}}-600/10 px-3 py-1 text-sm/6 font-semibold text-{{color}}-600 ring-1 ring-{{color}}-600/10 ring-inset">{{hero_section.pill_4}}</span>
                                    <span *ngIf="hero_section.quick_look" class="inline-flex items-center space-x-2 text-sm/6 font-medium text-gray-600">
                                        <span>{{hero_section.quick_look}}</span>
                                        <svg class="size-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" data-slot="icon">
                                            <path fill-rule="evenodd" d="M8.22 5.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L11.94 10 8.22 6.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                                        </svg>
                                    </span>
                                    <span></span>
                                </a>
                            </div>
                            <h1 class="mt-10 text-5xl font-semibold tracking-tight text-pretty text-gray-900 sm:text-6xl">{{hero_section.title}}</h1>
                            <p class="mt-8 text-lg font-medium text-pretty text-gray-500 sm:text-xl/8">{{hero_section.description}}</p>
                            <div class="mt-10 flex items-center gap-x-6">
                                <a routerLink="/pages/contact-page" class="rounded-md bg-{{color}}-600 px-3.5 py-2.5 cursor-pointer text-sm font-semibold text-white shadow-xs hover:bg-{{color}}-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-{{color}}-600">{{hero_section.cta_1.text}}</a>
                                <a routerLink="/pages/contact-page" class="text-sm/6 font-semibold cursor-pointer text-gray-900">{{hero_section.cta_2.text}}<span aria-hidden="true"> →</span></a>
                            </div>
                        </div>
                        <div class="mt-14 flex justify-end gap-8 sm:-mt-44 sm:justify-start sm:pl-20 lg:mt-0 lg:pl-0">
                            <div class="ml-auto w-44 flex-none space-y-8 pt-32 sm:ml-0 sm:pt-80 lg:order-last lg:pt-36 xl:order-none xl:pt-80">
                                <div class="relative">
                                    <img src="{{hero_section.image_1}}" class="aspect-2/3 w-full rounded-xl bg-gray-900/5 object-cover object-center shadow-lg">
                                    <div class="pointer-events-none absolute inset-0 rounded-xl ring-1 ring-gray-900/10 ring-inset"></div>
                                </div>
                            </div>
                            <div class="mr-auto w-44 flex-none space-y-8 sm:mr-0 sm:pt-52 lg:pt-36">
                                <div class="relative">
                                    <img src="{{hero_section.image_2}}" class="aspect-2/3 w-full rounded-xl bg-gray-900/5 object-cover shadow-lg" style="object-position: center 30%">
                                    <div class="pointer-events-none absolute inset-0 rounded-xl ring-1 ring-gray-900/10 ring-inset"></div>
                                </div>
                                <div class="relative">
                                    <img src="{{hero_section.image_3}}" class="aspect-2/3 w-full rounded-xl bg-gray-900/5 object-cover object-center shadow-lg">
                                    <div class="pointer-events-none absolute inset-0 rounded-xl ring-1 ring-gray-900/10 ring-inset"></div>
                                </div>
                            </div>
                            <div class="w-44 flex-none space-y-8 pt-32 sm:pt-0">
                                <div class="relative">
                                    <img src="{{hero_section.image_4}}" class="aspect-2/3 w-full rounded-xl bg-gray-900/5 object-cover shadow-lg" style="object-position: center 40%">
                                    <div class="pointer-events-none absolute inset-0 rounded-xl ring-1 ring-gray-900/10 ring-inset"></div>
                                </div>
                                <div class="relative">
                                    <img src="{{hero_section.image_5}}" class="aspect-2/3 w-full rounded-xl bg-gray-900/5 object-cover shadow-lg" style="object-position: center 20%">
                                    <div class="pointer-events-none absolute inset-0 rounded-xl ring-1 ring-gray-900/10 ring-inset"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
