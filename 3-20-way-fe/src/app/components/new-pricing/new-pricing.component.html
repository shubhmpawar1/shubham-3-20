<div class="relative isolate bg-white px-6 py-24 sm:py-32 lg:px-8">
    <div aria-hidden="true" class="absolute inset-x-0 -top-3 -z-10 transform-gpu overflow-hidden px-36 blur-3xl">
        <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)"
            class="mx-auto aspect-1155/678 w-288.75 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-20"></div>
    </div>
    <!-- <div class="mx-auto max-w-4xl text-center">
        <h2 class="text-base/7 font-semibold text-indigo-400">{{ pricing_data.title }}</h2>
        <p class="mt-2 text-5xl font-semibold tracking-tight text-balance text-white sm:text-6xl">{{
            pricing_data.headline }}</p>
    </div> -->
    <p class="mx-auto mt-6 max-w-5xl text-center text-lg font-medium text-black sm:text-xl/8">
        <span *ngFor="let line of pricing_data.description; let last = last">
            <span [innerHTML]="line"></span>
            <br *ngIf="!last">
        </span>
    </p>
    <div
        class="mx-auto mt-16 grid max-w-lg grid-cols-1 items-center gap-y-6 sm:mt-20 sm:gap-y-0 lg:max-w-4xl lg:grid-cols-2">

        <div *ngFor="let tier of pricing_data.tiers; let i = index" [ngClass]="{
                'rounded-3xl p-8 ring-1 ring-white/10 sm:p-10 flex flex-col items-center text-center transition-all duration-300': true,
                'bg-gray-600 sm:mx-8 sm:rounded-b-none lg:mx-0 lg:rounded-tr-none lg:rounded-bl-3xl': !tier.featured,
                'relative bg-orange-400 lg:-mt-8 lg:-ml-4 lg:py-12 z-10 shadow-2xl': tier.featured
            }">
            <div *ngIf="tier.featured"
                class="absolute top-0 right-0 bg-[#03aff0] text-white px-8 py-3 rounded-tr-3xl rounded-bl-[2.5rem] text-lg font-bold">
                Best Value
            </div>
            <h3 [id]="'tier-' + tier.name.toLowerCase()" class="text-xl font-bold text-white">{{ tier.name }}</h3>
            <div class="mt-4 flex flex-col items-center">
                <span class="text-7xl font-extrabold tracking-tight text-white">{{ tier.price }}</span>
                <span class="mt-2 text-xl font-bold text-white">{{ tier.period }}</span>
            </div>
            <p class="mt-6 text-base font-semibold text-white">{{ tier.description }}</p>

            <a [href]="tier.cta.link" [attr.aria-describedby]="'tier-' + tier.name.toLowerCase()" [ngClass]="{
                    'mt-8 block w-full rounded-2xl border-2 border-white px-6 py-3 text-center text-lg font-bold transition-colors': true,
                    'bg-orange-400 text-white hover:bg-white hover:text-orange-400': !tier.featured,
                    'bg-gray-700 text-white hover:bg-gray-800': tier.featured
                }">{{ tier.cta.text }}</a>
            <p class="mt-6 text-sm text-white opacity-90" [innerHTML]="tier.description2"></p>
        </div>
    </div>
</div>
