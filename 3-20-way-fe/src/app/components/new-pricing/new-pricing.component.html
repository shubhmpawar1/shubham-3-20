<div class="relative isolate bg-white px-6 py-24 sm:py-32 lg:px-8" *ngIf="pricing_data">
    <div aria-hidden="true" class="absolute inset-x-0 -top-3 -z-10 transform-gpu overflow-hidden px-36 blur-3xl">
        <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)"
            class="mx-auto aspect-1155/678 w-288.75 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-30"></div>
    </div>
    <div class="mx-auto max-w-4xl text-center">
        <h2 class="text-base/7 font-semibold text-orange-600">{{ pricing_data.title }}</h2>
        <p class="mt-2 text-5xl font-semibold tracking-tight text-balance text-gray-900 sm:text-6xl">{{
            pricing_data.headline }}</p>
    </div>
    <p class="mx-auto mt-6 max-w-2xl text-center text-lg font-medium text-pretty text-gray-600 sm:text-xl/8">{{
        pricing_data.description }}</p>

    <div
        class="mx-auto mt-16 grid max-w-lg grid-cols-1 items-center gap-y-6 sm:mt-20 sm:gap-y-0 lg:max-w-4xl lg:grid-cols-2">
        <div *ngFor="let tier of pricing_data.tiers" [ngClass]="{
                'rounded-3xl p-8 ring-1 ring-gray-900/10 sm:p-10 flex flex-col': true,
                'bg-white/60 sm:mx-8 sm:rounded-b-none lg:mx-0 lg:rounded-tr-none lg:rounded-bl-3xl': !tier.featured,
                'relative bg-gray-900 shadow-2xl': tier.featured
            }">
            <h3 [id]="'tier-' + tier.name.toLowerCase()"
                [ngClass]="tier.featured ? 'text-indigo-400' : 'text-indigo-600'" class="text-base/7 font-semibold">{{
                tier.name }}</h3>
            <p class="mt-4 flex items-baseline gap-x-2">
                <span [ngClass]="tier.featured ? 'text-white' : 'text-gray-900'"
                    class="text-5xl font-semibold tracking-tight">{{ tier.price }}</span>
                <span [ngClass]="tier.featured ? 'text-gray-400' : 'text-gray-500'" class="text-base">{{ tier.period
                    }}</span>
            </p>
            <p [ngClass]="tier.featured ? 'text-gray-300' : 'text-gray-600'" class="mt-6 text-base/7">{{
                tier.description }}</p>
            <ul role="list" [ngClass]="tier.featured ? 'text-gray-300' : 'text-gray-600'"
                class="mt-8 space-y-3 text-sm/6 sm:mt-10">
                <li *ngFor="let feature of tier.features" class="flex gap-x-3">
                    <svg viewBox="0 0 20 20" fill="currentColor" data-slot="icon" aria-hidden="true"
                        [ngClass]="tier.featured ? 'text-indigo-400' : 'text-indigo-600'" class="h-6 w-5 flex-none">
                        <path
                            d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
                            clip-rule="evenodd" fill-rule="evenodd" />
                    </svg>
                    {{ feature }}
                </li>
            </ul>
            <a href="#" [attr.aria-describedby]="'tier-' + tier.name.toLowerCase()" [ngClass]="{
                    'mt-8 block rounded-md px-3.5 py-2.5 text-center text-sm font-semibold sm:mt-10': true,
                    'text-indigo-600 inset-ring inset-ring-indigo-200 hover:inset-ring-indigo-300 focus-visible:outline-indigo-600': !tier.featured,
                    'bg-indigo-500 text-white shadow-xs hover:bg-indigo-400 focus-visible:outline-indigo-500': tier.featured
                }">{{ tier.cta }}</a>
        </div>
    </div>
</div>
